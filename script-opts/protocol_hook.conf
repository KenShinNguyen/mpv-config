# Danh sách chương trình được phép chạy qua `mpv://...?app=<base64>`,
# ngăn cách bằng dấu phẩy.
#
# ĐỂ TRỐNG (mặc định) = tắt hẳn tính năng đó.
#
# Tham số `app` do trang web đặt trong URL, nên nếu không giới hạn thì bất kỳ
# trang nào cũng chạy được chương trình bất kỳ trên máy bạn. Chỉ liệt kê ở đây
# đúng những chương trình bạn thực sự muốn mở từ trình duyệt, ví dụ:
#allowed_apps=vlc,iina
allowed_apps=
