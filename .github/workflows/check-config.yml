name: check-config

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Kiểm tra tính nhất quán của cấu hình
        run: python3 tools/check-config.py
