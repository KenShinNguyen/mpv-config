name: check-config

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Kiểm tra tính nhất quán của cấu hình
        run: python3 tools/check-config.py

      # LuaJIT chính là runtime mpv nhúng, nên đây là cùng một parser với lúc
      # mpv nạp script — không phải một phương ngữ Lua khác.
      - name: Cài LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit

      - name: Kiểm tra cú pháp Lua
        run: python3 tools/check-lua.py

      - name: Chạy test
        run: python3 tools/check-tests.py
